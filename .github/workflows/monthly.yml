name: Monthly validation

on:
  schedule:
    - cron: "2 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@5cee478a76114691570b13387e1c4f54e73d3c75 # v0.65.2
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
