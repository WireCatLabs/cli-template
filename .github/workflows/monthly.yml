name: Monthly validation

on:
  schedule:
    - cron: "2 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@facc418d2614f42838847bda9ef5e145019507ec # v0.78.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
