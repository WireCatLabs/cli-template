name: Monthly validation

on:
  schedule:
    - cron: "2 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@bff94fff66ae17bde081de343fb8cd56d66602e0 # v0.77.1
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
