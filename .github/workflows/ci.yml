name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
      platforms:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@b2d2418af0e23ecc816f3117ae2b0c627917fca5 # v0.55.0
    with:
      pack: ${{ inputs.pack || false }}
      bun-run: pnpm build && pnpm smoke:bun
      cli: true
      bin: clidev
      platforms: ${{ inputs.pack || inputs.platforms || github.event_name == 'workflow_dispatch' }}
      platform-run: |
        node dist/bin/clidev.js commands --json >/dev/null
        node dist/bin/clidev.js doctor --json >/dev/null
      # The skeleton has no store of its own; its config file and run records are cli-core's. A CLI that adds a store
      # adds a contracts:upgrade script and removes this skip (WC-TEST-14).
      skip: |
        contracts:upgrade
      checks: |
        bash scripts/audit.sh

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A warning, never a failure: a version npm already has is refused by bin/release, not here.
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          versions=$(npm view "$name" versions --json 2>/dev/null) || versions=""
          next=$(pnpm exec cli-dev next-version "$pr" "$latest" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above npm's latest ($latest); the next free one is $next"

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: install vale
        env:
          VALE_VERSION: 3.23.0
          VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
        run: |
          curl -sSfLo vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
      # Style findings are annotations until the rules are tuned; the tone rule (an error) fails.
      - run: ./vale --output line README.md docs/*.md | sed 's/^/::warning::/' || true
      - run: ./vale --minAlertLevel error README.md docs/*.md
