name: Start release

# The Release button: lands the changelog fold or a raised version through a pull request, then starts release.yml
# with the merged commit. The steps live in cli-base; see its docs/dev/release-workflow.md.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      actions: write
    uses: WireCatLabs/cli-base/.github/workflows/release-start.yml@7018773ccfffe2d1c5375fdb3136cf4cbcf2abb7 # v0.99.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      check: '[ -d kit ] || pnpm exec cli-dev live check --version "$VERSION"'
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
