name: Start release

# The Release button: lands the changelog fold or a raised version through a pull request, then starts release.yml
# with the merged commit. The steps live in cli-base; see its docs/dev/release-workflow.md.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      actions: write
    uses: WireCatLabs/cli-base/.github/workflows/release-start.yml@21b2f80c76fb46cf433deba6edb59cfbeb4b6676 # v0.112.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      check: '[ -d kit ] || grep -qs "\"preset\": \"generic\"" template.json || pnpm exec cli-dev live check --version "$VERSION"'
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
