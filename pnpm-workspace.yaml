# pnpm blocks dependencies' install scripts by default; esbuild needs its platform binary for vitest.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - "@wirecat/*"
# markdownlint-cli2 is pinned to community's version, whose markdown-it, katex and smol-toml have advisories.
overrides:
  markdown-it: ^15.0.3
  katex: ^0.18.2
  smol-toml: ^1.9.1
  # One MCP server copy until a cli-core release ranges it ^2.4.0 (cli-core#1960); two fail src/mcp.ts.
  "@wirecat/cli-core>@modelcontextprotocol/server": 2.4.0
